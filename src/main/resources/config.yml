# ═══════════════════════════════════════════════════
#               TeamUHC - config.yml
#   Süreler saniye cinsindendir (1500 = 25 dakika)
# ═══════════════════════════════════════════════════

prefix: "&8[&aUHC&8] "

game:
  # UHC'nin oynanacağı dünya
  world: "world"
  # Oyunun başlaması için gereken en az takım sayısı (tek başına test için 1 yap)
  min-teams: 2
  # PvP açılma süresi
  pvp-time: 1500
  # Doğal yenilenmenin kapanma süresi (sadece altın elma/iksir/altın kafa ile can dolar)
  regen-disable-time: 1500
  # Border'ın küçülmeye başlama zamanı
  border-start-time: 1500
  # Border'ın küçülme süresi
  border-shrink-time: 2400
  # Border bittikten kaç saniye sonra glow açılır
  glow-delay: 480
  # Oyun başında ışınlandıktan sonra hasar koruması (saniye)
  start-protection-seconds: 20
  # Oyun başlarken zorluğu Hard yap
  set-hard-difficulty: true
  # Oyun bittikten sonra sıfırlanma süresi
  end-delay: 15
  # Oyun bitince takımları sil
  reset-teams-on-end: true
  # Oyun başlamadan önce (lobi) hasar ve açlık kapalı
  lobby-protect: true
  # Başarım (advancement) mesajlarını gizle
  hide-advancements: true

border:
  start-size: 2000
  end-size: 20
  center:
    x: 0
    z: 0
  damage: 1.0
  warning-distance: 10

teams:
  # Takım başına oyuncu sayısı (2 = duo, 3 = trio, 4 = squad)
  size: 2
  # Takım arkadaşına hasar
  friendly-fire: false
  # Oyun başlarken takımı olmayanları rastgele takımlara dağıt (false = herkes tek kişilik takım)
  auto-assign: true
  # Davet geçerlilik süresi
  invite-timeout: 30
  name-format: "Takım %number%"
  # Takım aynı yerde doğsun
  spawn-together: true
  spawn-radius: 5
  chat:
    # Sohbette bu işaretle başlayan mesaj sadece takıma gider (ör: !merhaba)
    prefix: "!"
    format: "&b[Takım] &f%player%&7: &b%message%"

heads:
  # Ölen oyuncu kafa düşürsün
  drop-on-death: true
  name: "&6%player% Kafası"

# Tarif: 8 altın külçe + ortada 1 oyuncu kafası. Sağ tıklayınca yenir.
golden-head:
  enabled: true
  name: "&6Altın Kafa"
  lore:
    - "&7Sağ tıkla: can yeniler ve emilim verir."
  # Kafanın görünümü. minecraft-heads.com'da "golden head" aratıp beğendiğin kafanın
  # sayfasındaki "Value" (uzun base64 yazı) ya da textures.minecraft.net adresini buraya yapıştır.
  # Boş bırakırsan varsayılan (Steve) kafa görünür.
  texture: ""
  regen-seconds: 9
  regen-amplifier: 1        # 0 = I, 1 = II, 2 = III
  absorption-seconds: 120
  absorption-amplifier: 0

# Border içine rastgele düşen sandıklar
airdrops:
  enabled: true
  # Oyun başladıktan kaç saniye sonra ilk airdrop düşer
  first-drop-seconds: 900
  # Sonraki airdrop'lar arasındaki süre
  interval-seconds: 300
  # Border kenarından en az bu kadar blok içeride düşer
  border-margin: 30
  # Sandık başına eşya çeşidi sayısı
  items-per-chest:
    min: 6
    max: 10
  # Format: MATERYAL:min-max:ağırlık  (ağırlık büyüdükçe çıkma ihtimali artar)
  # Özel: GOLDEN_HEAD = Altın Kafa. Aynı sandıkta aynı eşya iki kez çıkmaz.
  loot:
    - "GOLDEN_APPLE:1-3:20"
    - "GOLDEN_HEAD:1-2:10"
    - "DIAMOND:1-3:10"
    - "IRON_INGOT:4-10:18"
    - "GOLD_INGOT:4-10:15"
    - "COOKED_BEEF:8-16:20"
    - "ARROW:16-32:14"
    - "BOW:1:8"
    - "ENDER_PEARL:1-2:8"
    - "OBSIDIAN:4-8:8"
    - "WATER_BUCKET:1:8"
    - "LAVA_BUCKET:1:6"
    - "IRON_SWORD:1:6"
    - "IRON_CHESTPLATE:1:5"
    - "IRON_LEGGINGS:1:5"
    - "EXPERIENCE_BOTTLE:4-8:8"

glow:
  enabled: true

timers:
  enabled: true
  # Geri sayım mesajı aralığı (saniye). Ayrıca 30, 10 ve son 5 saniyede de yazar.
  interval: 60

messages:
  unit-minute: "dk"
  unit-second: "sn"

